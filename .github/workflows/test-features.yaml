name: Test - Features
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - fish-persistent-data
          - poetry-persistent-cache
          - yarn-persistent-cache
        baseImage:
          - mcr.microsoft.com/devcontainers/base:alpine
          - mcr.microsoft.com/devcontainers/base:debian
          - mcr.microsoft.com/devcontainers/base:ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install tools
        uses: ./.github/actions/mise-project-setup

      - name: Running tests for '${{ matrix.feature }}' against '${{ matrix.baseImage }}'

        env:
          BASE_IMAGE: ${{ matrix.baseImage }}
          FEATURE: ${{ matrix.feature }}
        run: mise exec -- devcontainer features test --skip-scenarios -f "$FEATURE" -i "$BASE_IMAGE" .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - fish-persistent-data
          - poetry-persistent-cache
          - yarn-persistent-cache

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install tools
        uses: ./.github/actions/mise-project-setup

      - name: Running tests for '${{ matrix.feature }}' scenarios

        env:
          FEATURE: ${{ matrix.feature }}
        run: mise exec -- devcontainer features test -f "$FEATURE" --skip-autogenerated --skip-duplicated .

  test-rebuild:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - fish-persistent-data
          - poetry-persistent-cache
          - yarn-persistent-cache
        fixture:
          - rebuild
        include:
          - feature: fish-persistent-data
            fixture: upgrade-from-v1
            from: "1"
          - feature: fish-persistent-data
            fixture: upgrade-from-v1-without-history
            from: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install tools
        uses: ./.github/actions/mise-project-setup

      - name: Testing '${{ matrix.feature }}' data across a rebuild with '${{ matrix.fixture }}'${{ matrix.from && format(' from ''{0}''', matrix.from) || '' }}

        env:
          FEATURE: ${{ matrix.feature }}
          FIXTURE: ${{ matrix.fixture }}
          FROM: ${{ matrix.from }}
        # FROM is split into one argument per version on purpose: it lists the
        # published versions to start from, oldest first.
        run: mise run test:rebuild "$FEATURE" "$FIXTURE" $FROM

  test-global:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install tools
        uses: ./.github/actions/mise-project-setup

      - name: Testing global scenarios
        run: mise exec -- devcontainer features test --global-scenarios-only .
